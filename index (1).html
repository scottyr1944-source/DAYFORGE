Listener('click',()=>builder());$$('[data-act]').forEach(e=>e.onclick=()=>start(e.dataset.act));$$('.startGame').forEach(e=>e.onclick=()=>start(e.dataset.id));$$('.edit').forEach(e=>e.onclick=ev=>{ev.stopPropagation();builder(s.acts.find(a=>a.id===e.dataset.id))});$$('[data-reward]').forEach(e=>e.onclick=()=>openPathReward(+e.dataset.reward));$$('.leagueCard').forEach(e=>e.onclick=()=>{$$('.leagueCard').forEach(x=>x.classList.toggle('view',x===e));$('#board').innerHTML=board(e.dataset.league)});$('#test')?.addEventListener('click',()=>{s.test=!s.test;save();render()});$('#title')?.addEventListener('click',()=>toast(s.title==='Founder'?'Unique Legacy Title: creator of DAYFORGE.':'Unique Legacy Title: first ever DAYFORGE tester.'));$('#owner')?.addEventListener('click',owner);$('#resetAccount')?.addEventListener('click',confirmReset);bindScheduleSwipes()}function center(){document.querySelector(`[data-league="${s.league}"]`)?.scrollIntoView({behavior:'auto',inline:'center',block:'nearest'})}function confirmReset(){overlay(`<div class="modal"><div class="sheethead"><h2>Reset this account?</h2><button class="close" data-close>×</button></div><div class="dangerBox"><h3>This erases local DAYFORGE data.</h3><p>Your profile, schedule, activity history, XP, Coins, Energy, Tickets, test state, and local notifications will be cleared on this browser. Founder access is kept separately.</p></div><div style="height:12px"></div><button class="btn coral full" id="confirmReset">RESET + RETURN TO ACCOUNT CREATION</button><div style="height:8px"></div><button class="btn secondary full" data-close>CANCEL</button></div>`,1);$('#confirmReset').onclick=()=>{try{localStorage.removeItem(KEY)}catch{}s=fresh();save();close();render();toast('Local account reset.')}}function builder(ex=null){let b=ex?JSON.parse(JSON.stringify(ex)):{id:'',name:'',cat:'Fitness',style:'Classic',min:20,hearts:3,target:10,opts:['',''],time:'16:00'},step=1;b.time=normalizeTime(b.time||'16:00');function draw(){overlay(`<div class="modal"><div class="sheethead"><h2>${ex?'Edit activity':'Forge an activity'}</h2><button class="close" data-close>×</button></div><div class="stepbar">${[1,2,3].map(i=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>${step===1?`<div class="field"><label>WHAT ARE YOU DOING?</label><input class="input" id="an" value="${esc(b.name)}" placeholder="e.g. Chemistry review"></div><div class="choices">${['Fitness','Study','Habits','Skills','Projects','Chores','Work','Custom'].map(c=>`<button class="choice ${b.cat===c?'on':''}" data-cat="${c}"><b>${catIcon(c,'mini')} ${c}</b><span>${{Fitness:'Training and movement',Study:'School and focus',Habits:'Routines',Skills:'Practice',Projects:'Build something',Chores:'Reset and maintain',Work:'Business or work',Custom:'Anything else'}[c]}</span></button>`).join('')}</div><div style="height:13px"></div><button class="btn primary full" id="next">NEXT</button>`:step===2?`<div class="choices">${['Classic','Timer','Strikes','Challenge','Roulette','Cards'].map(x=>`<button class="choice ${b.style===x?'on':''}" data-style="${x}"><div class="modeico">${ic(si(x))}</div><b>${x}</b><span>${{Classic:'Track start to finish',Timer:'Real countdown',Strikes:'Mistakes cost hearts',Challenge:'Move toward a target',Roulette:'Spin your options',Cards:'Draw your tasks'}[x]}</span></button>`).join('')}</div><div style="height:13px"></div><button class="btn primary full" id="next">NEXT</button>`:`<div class="timeScheduleCard"><div>${dicon('clock')}<b>WHEN SHOULD IT HAPPEN?</b><small>Your Home path sorts itself by this time.</small></div><input class="input timeInput" type="time" id="acttime" value="${b.time}"></div><div class="field"><label>PLANNED TIME (MIN)</label><input class="input" type="number" id="min" value="${b.min}"></div>${b.style==='Strikes'?`<div class="field"><label>HEARTS</label><div class="hearts">${[1,2,3,4,5].map(n=>`<button class="heart ${n<=b.hearts?'on':''}" data-heart="${n}">${n}</button>`).join('')}</div></div>`:''}${b.style==='Challenge'?`<div class="field"><label>TARGET NUMBER</label><input class="input" type="number" id="target" value="${b.target}"></div>`:''}${['Roulette','Cards'].includes(b.style)?`<div class="field"><label>${b.style==='Roulette'?'WHEEL OPTIONS':'CARD TASKS'}</label><textarea class="textarea" id="opts">${esc((b.opts||[]).filter(Boolean).join('\n'))}</textarea><div class="helper">One option per line. Add at least 2.</div></div>`:''}<button class="btn green full" id="saveact">${ex?'SAVE CHANGES':'ADD TO MY PATH'}</button>${ex?`<button class="btn full removeActivity" id="removeAct">${dicon('trash','mini')} REMOVE FROM SCHEDULE</button>`:''}`}</div>`,1);$$('[data-cat]').forEach(x=>x.onclick=()=>{let f=$('#an');if(f)b.name=f.value;b.cat=x.dataset.cat;draw()});$$('[data-style]').forEach(x=>x.onclick=()=>{b.style=x.dataset.style;draw()});$$('[data-heart]').forEach(x=>x.onclick=()=>{b.hearts=+x.dataset.heart;draw()});$('#next')?.addEventListener('click',()=>{if(step===1){b.name=$('#an').value.trim();if(!b.name)return toast('Give it a name.')}step++;draw()});$('#saveact')?.addEventListener('click',()=>{b.time=normalizeTime($('#acttime').value);b.min=Math.max(1,+$('#min').value||20);if(b.style==='Challenge')b.target=Math.max(1,+$('#target').value||10);if(['Roulette','Cards'].includes(b.style)){b.opts=$('#opts').value.split('\n').map(x=>x.trim()).filter(Boolean);if(b.opts.length<2)return toast('Add at least 2 options.')}if(ex)s.acts[s.acts.findIndex(x=>x.id===ex.id)]=b;else{b.id='a'+Date.now();s.acts.push(b);note('Activity forged',`${b.name} is scheduled for ${fmtTime(b.time)}.`,'plus')}s.acts=sortedActs();save();close();render();toast(ex?'Schedule updated.':'Added to your path.')});$('#removeAct')?.addEventListener('click',()=>{let id=ex.id;close();deleteActivity(id)})}draw()}function start(id){let a=s.acts.find(x=>x.id===id);if(!a)return;s.active={id,start:Date.now(),strikes:0,safes:0,progress:0,current:null,drawn:[]};save();render()}function activity(){let a=s.acts.find(x=>x.id===s.active.id),e=document.createElement('div');e.className='activity originalActivity';e.id='activity';e.innerHTML=`<div class="activityHeader"><div class="activityBrand"><b>DAYFORGE</b><span>${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</span></div><div class="activityMini">${catIcon(a.cat,'activityArt')}</div></div><div class="actbody originalActBody"><div class="activityModePill">${a.style.toUpperCase()} MODE</div><h1><span>${catIcon(a.cat,'activityArt')}</span> ${esc(a.name)}</h1><p class="activitySub">${esc(a.cat)} challenge • stay focused, log honestly, finish strong.</p><div class="clockStrip"><span>ELAPSED</span><b id="clock">00:00</b></div>${abody(a)}</div>`;app.appendChild(e);abind(a);uptime()}function abody(a){let z=s.active;if(a.style==='Strikes')return`<div class="card gameCard strikeGame"><div class="heartPips">${Array.from({length:a.hearts},(_,i)=>`<span class="heartPip ${i<z.strikes?'lost':''}">${dicon('heart')}</span>`).join('')}</div><h2>${z.strikes===0?'Perfect run still alive.':'Keep going.'}</h2><p>Strikes: ${z.strikes}/${a.hearts} • Safeties: ${z.safes}</p><div class="actions two"><button class="btn coral" id="strike">＋ STRIKE</button><button class="btn primary" id="safe">＋ SAFETY</button></div></div>${finish()}`;if(a.style==='Challenge')return`<div class="card gameCard"><div class="big">${z.progress} / ${a.target}</div><div class="progress challengeProgress"><i style="width:${Math.min(100,z.progress/a.target*100)}%;background:var(--purple)"></i></div><h2>Chase the target.</h2><div class="actions two"><button class="btn purple" id="plus">＋ 1</button><button class="btn secondary" id="minus">− 1</button></div></div>${finish()}`;if(a.style==='Roulette')return`<div class="card gameCard"><div class="wheelPtr"></div><div class="wheel" id="wheel"></div><div class="result">${z.current?esc(z.current):'Ready to spin'}</div><div class="actions"><button class="btn primary" id="spin">SPIN</button><button class="btn green" id="round" ${z.current?'':'disabled'}>ROUND COMPLETE</button></div></div>${finish()}`;if(a.style==='Cards')return`<div class="card gameCard"><div class="deck ${z.current?'':'back'}">${z.current?`<b>${esc(z.current)}</b>`:'<b>DAYFORGE</b>'}</div><div class="actions"><button class="btn purple" id="draw">${z.current?'DRAW ANOTHER':'DRAW CARD'}</button><button class="btn green" id="carddone" ${z.current?'':'disabled'}>CARD COMPLETE</button></div></div>${finish()}`;if(a.style==='Timer')return`<div class="card gameCard timerGame"><div class="big" id="count">${clock(a.min*60-(Date.now()-z.start)/1000)}</div><h2>Stay with it.</h2><p>Real ${a.min}-minute countdown.</p></div>${finish()}`;return`<div class="card gameCard"><div class="big">IN PROGRESS</div><h2>Do the real thing.</h2><p>The clock is running. Finish when the activity is actually done.</p></div>${finish()}` }function finish(){return`<div class="actions"><button class="btn green full" id="finish">FINISH + LOG ACTIVITY</button><button class="btn secondary full" id="end">END WITHOUT REWARD</button></div>`}function abind(a){$('#strike')?.addEventListener('click',()=>{s.active.strikes=Math.min(a.hearts,s.active.strikes+1);save();rerenderAct()});$('#safe')?.addEventListener('click',()=>{s.active.safes++;save();rerenderAct()});$('#plus')?.addEventListener('click',()=>{s.active.progress=Math.min(a.target,s.active.progress+1);save();rerenderAct()});$('#minus')?.addEventListener('click',()=>{s.active.progress=Math.max(0,s.active.progress-1);save();rerenderAct()});$('#spin')?.addEventListener('click',()=>{let w=$('#wheel'),pick=a.opts[Math.floor(Math.random()*a.opts.length)];w.style.transform=`rotate(${1440+Math.floor(Math.random()*720)}deg)`;setTimeout(()=>{s.active.current=pick;save();rerenderAct()},4200)});$('#round')?.addEventListener('click',()=>{s.active.progress++;s.active.current=null;save();rerenderAct()});$('#draw')?.addEventListener('click',()=>{let pool=a.opts.filter(x=>!s.active.drawn.includes(x));if(!pool.length)pool=a.opts;s.active.current=pool[Math.floor(Math.random()*pool.length)];save();rerenderAct()});$('#carddone')?.addEventListener('click',()=>{s.active.progress++;s.active.drawn.push(s.active.current);s.active.current=null;save();rerenderAct()});$('#finish').onclick=()=>complete(a);$('#end').onclick=()=>{s.active=null;save();render();toast('Session ended.')}}function rerenderAct(){$('#activity')?.remove();activity()}function uptime(){if(!s.active)return;let a=s.acts.find(x=>x.id===s.active.id),sec=(Date.now()-s.active.start)/1000;$('#clock')&&($('#clock').textContent=clock(sec));if(a?.style==='Timer'&&$('#count'))$('#count').textContent=clock(a.min*60-sec);setTimeout(uptime,500)}function complete(a){let sec=Math.max(1,Math.round((Date.now()-s.active.start)/1000));if(a.style==='Challenge'&&s.active.progress<a.target)return toast('Hit the challenge target first.');if(a.style==='Timer'&&sec<a.min*60&&!s.test)return toast(`Timer still has ${clock(a.min*60-sec)} left.`);let xp=Math.max(30,Math.min(250,a.min*4))+(a.style==='Challenge'?30:a.style==='Strikes'&&s.active.strikes===0?35:0);s.total+=xp;s.xp+=xp;s.lxp+=xp;s.coins+=Math.round(xp*.25);let en=Math.max(3,Math.round(a.min/5));s.energy=(s.energy||0)+en;while(s.xp>=need()){s.xp-=need();s.level++;note(`Level ${s.level}!`,'Your permanent DAYFORGE level increased.')}s.hist.unshift({id:a.id,sec,xp,at:Date.now()});note('Activity complete',`${a.name} • +${xp} XP • +${en} Energy`,'check');s.active=null;queuePathReward();save();render();toast(`+${xp} XP • logged`)}function notes(){s.notes.forEach(n=>n.read=1);save();overlay(`<div class="sheet"><div class="sheethead"><h2>Notifications</h2><button class="close" data-close>×</button></div>${s.notes.length?s.notes.map(n=>`<div class="notice ${n.fromFounder?'founderNotice':''}"><div class="nicon">${dicon(n.fromFounder?'founder':(n.ico==='check'?'check':n.ico==='plus'?'plus':'custom'),'mini')}</div><div><b>${esc(n.t)} ${n.fromFounder?founderMark():''}</b><p>${esc(n.b)}</p>${n.sender?`<small>From ${esc(n.sender)}</small>`:''}</div></div>`).join(''):`<div class="card empty"><h3>Quiet in here.</h3><p>Notifications appear because something actually happened.</p></div>`}</div>`)}function arcadeSheet(){overlay(`<div class="sheet"><div class="sheethead"><div><h2>THE ARCADE</h2><div class="muted">Real activities charge your Arcade Energy.</div></div><button class="close" data-close>×</button></div><div class="card arcadeSheetHero" style="background:#15152A;color:white"><div>${dicon('city','large')}</div><div style="font-size:24px;font-weight:900;color:#45F3FF;margin-top:6px;display:flex;align-items:center;gap:7px">${s.energy||0} ${dicon('energy','mini')}</div><div style="font-size:11px;color:#C9C8EA;font-weight:700;margin-top:4px">Stored energy • Tickets ${s.tickets||0}</div></div><div class="card empty originalEmpty"><div class="emptyBig">${dicon('arcade','large')}</div><h3>Arcade machines are next.</h3><p>The energy loop is live now. Machines will spend this energy once the full Arcade is connected.</p></div></div>`)}function owner(){overlay(`<div class="sheet founderConsole"><div class="founderConsoleHead"><div class="founderSeal">${dicon('founder')}</div><div><small>OWNER CONTROL ROOM</small><h2>FOUNDER CONSOLE</h2><p>${esc(s.name||'Founder')} ${founderMark()} • verified local owner session</p></div><button class="close" data-close>×</button></div><div class="adminFilters"><button class="on" data-adminfilter="all">ALL</button><button data-adminfilter="live">LIVE</button><button data-adminfilter="planned">PLANNED</button></div><div class="adminSection" data-adminstatus="live"><div class="adminSectionTitle"><b>TEST LAB</b><span class="liveTag">LIVE</span></div><div class="adminGrid"><button class="adminCmd" id="addCoins"><span>${dicon('coin','adminArt')}</span><b>+500 Coins</b><small>Local test account</small></button><button class="adminCmd" id="addEnergy"><span>${dicon('energy','adminArt')}</span><b>+25 Energy</b><small>Local test account</small></button><button class="adminCmd" id="addTickets"><span>${dicon('ticket','adminArt')}</span><b>+100 Tickets</b><small>Local test account</small></button><button class="adminCmd" id="jump"><span>${dicon('trophy','adminArt')}</span><b>Preview Forge State</b><small>LOCAL TEST ONLY • no public rank</small></button><button class="adminCmd" id="forceReward"><span>${dicon('reward','adminArt')}</span><b>Path Reward</b><small>Preview reveal</small></button><button class="adminCmd" id="addXp"><span>${dicon('custom','adminArt')}</span><b>+500 Test XP</b><small>Local only</small></button></div><div class="adminTierCard"><div><b>LOCAL TIER TEST</b><small>Changes this browser profile only.</small></div><select id="adminTier"><option ${s.tier==='Free'?'selected':''}>Free</option><option ${s.tier==='Plus'?'selected':''}>Plus</option><option ${s.tier==='MAX'?'selected':''}>MAX</option></select></div></div><div class="adminSection" data-adminstatus="live"><div class="adminSectionTitle"><b>GIFT STUDIO</b><span class="liveTag">LOCAL PREVIEW</span></div><div class="giftStudio"><div class="field"><label>RECIPIENT</label><input class="input" id="giftUser" placeholder="@username (backend later)"></div><div class="field"><label>GIFT</label><select class="input" id="giftType"><option value="max">30 DAYS OF MAX</option><option value="plus">30 DAYS OF PLUS</option><option value="coins">100 COINS</option><option value="energy">25 ARCADE ENERGY</option><option value="chest">FOUNDER GIFT CHEST</option></select></div><div class="field"><div class="labelCounter"><label>SHORT MESSAGE • OPTIONAL</label><span id="giftCount">0 / 30</span></div><input class="input" maxlength="30" id="giftMsg" placeholder="Thanks for testing!!"></div><div class="giftButtons"><button class="btn purple" id="previewGift">PREVIEW REVEAL</button><button class="btn green" id="localGift">TEST ON THIS BROWSER</button></div><div class="plannedSend"><button disabled>SEND TO REAL USER</button><span>PLANNED • requires real cloud accounts</span></div></div></div><div class="adminSection" data-adminstatus="planned"><div class="adminSectionTitle"><b>USERS + ACCESS</b><span class="plannedTag">PLANNED</span></div>${plannedCommand('search','Search any user','Open profiles, account status, tier, tester flags and diagnostics.')}${plannedCommand('gem','Grant Plus / MAX','7, 30, 90 days, custom expiry, or permanent admin grant.')}${plannedCommand('flask','Tester access','Alpha, Founding Tester, experimental features and beta groups.')}</div><div class="adminSection" data-adminstatus="planned"><div class="adminSectionTitle"><b>IDENTITY + GIFTS</b><span class="plannedTag">PLANNED</span></div>${plannedCommand('tag','Grant titles','FIRST FORGER, ALPHA FORGER, FOUNDING TESTER and future special titles.')}${plannedCommand('shirt','Avatar items','Grant/revoke cosmetics once the real avatar inventory exists.')}${plannedCommand('founder','Founder-only items','Create and gift exclusive cosmetic items once cosmetics exist.')}</div><div class="adminSection" data-adminstatus="planned"><div class="adminSectionTitle"><b>RUN DAYFORGE</b><span class="plannedTag">PLANNED</span></div>${plannedCommand('megaphone','Announcements','Send in-app announcements to everyone or selected groups.')}${plannedCommand('skills','Events + challenges','Create timed events, global challenges and reward periods.')}${plannedCommand('shield','Moderation','Reports, suspensions, blocks, content removal and audit reasons.')}${plannedCommand('chart','League audit','Inspect suspicious League XP without granting competitive advantage.')}${plannedCommand('repair','Diagnostics','Sync state, crashes, versions, account repair and audit history.')}${plannedCommand('tools','Feature switches','Roll unfinished features out to owner, testers, groups, or everyone once accounts exist.')}${plannedCommand('blocks','Content controls','Built-in templates, game styles, Arcade machines, reward pools and future community templates.')}${plannedCommand('chart','Real analytics','Users, activity completion, retention, subscription counts and version adoption. No fabricated metrics.')}</div></div>`);$$('[data-adminfilter]').forEach(b=>b.onclick=()=>{$$('[data-adminfilter]').forEach(x=>x.classList.toggle('on',x===b));let f=b.dataset.adminfilter;$$('[data-adminstatus]').forEach(x=>x.style.display=f==='all'||x.dataset.adminstatus===f?'':'none')});$('#addCoins').onclick=()=>{s.coins+=500;save();toast('+500 test Coins')};$('#addEnergy').onclick=()=>{s.energy+=25;save();toast('+25 test Energy')};$('#addTickets').onclick=()=>{s.tickets+=100;save();toast('+100 test Tickets')};$('#jump').onclick=()=>{s.league='Forge';save();toast('Local Forge preview only • no leaderboard rank')};$('#addXp').onclick=()=>{s.xp+=500;save();toast('+500 test XP')};$('#forceReward').onclick=()=>{s.pendingDelivery={kind:'path',title:'PATH REWARD',gift:'TEST CHEST',message:'Reward reveal preview.',icon:'reward',preview:true,reward:{coins:30,energy:5}};save();close();deliveryPopup()};$('#adminTier').onchange=e=>{s.tier=e.target.value;save();toast(`Local tier: ${s.tier}`)};let msg=$('#giftMsg'),count=$('#giftCount');msg.oninput=()=>count.textContent=`${msg.value.length} / 30`;$('#previewGift').onclick=()=>{s.pendingDelivery=makeFounderGift($('#giftType').value,msg.value,true);save();close();deliveryPopup()};$('#localGift').onclick=()=>{s.pendingDelivery=makeFounderGift($('#giftType').value,msg.value,false);save();close();deliveryPopup()}}function overlay(h,c=0){close();let o=document.createElement('div');o.id='overlay';o.className='overlay'+(c?' center':'');o.innerHTML=h;app.appendChild(o);$$('[data-close]',o).forEach(x=>x.onclick=close);o.onclick=e=>{if(e.target===o)close()}}function close(){$('#overlay')?.remove()}try{render()}catch(err){console.error(err);app.innerHTML=`<div style="padding:28px;font-family:system-ui;background:#FFF7E8;height:100%;color:#2E3542"><h1 style="font-size:28px">DAYFORGE hit a snag.</h1><p style="font-weight:700;color:
